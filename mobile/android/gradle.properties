# Sized for a 16 GB development machine that also runs the emulator and the backend.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Plugin sources live in the pub cache, which may be on another drive than the project.
# Kotlin incremental compilation cannot relate paths across drives on Windows and
# fails the build ("different roots"), so it is turned off.
kotlin.incremental=false
