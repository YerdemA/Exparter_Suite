name: exparter

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to loopback only: the dev database must not be reachable from the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data in a version-specific subdirectory,
      # so the volume is mounted one level above the old /data path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the API sends in development; nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # S3-compatible object storage for uploads such as avatars (see ADR 0010).
  # --default-bucket makes the single node create its layout, the access key and the
  # bucket on first start, so no manual setup is needed.
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_DEFAULT_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      GARAGE_DEFAULT_BUCKET: ${STORAGE_BUCKET:-exparter}
    ports:
      - "127.0.0.1:${STORAGE_PORT:-3900}:3900"
    volumes:
      - ./infra/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # Media server for the video calls of online sessions (see ADR 0015). Signalling on
  # 7880; media over UDP 7882, or TCP 7881 where UDP is blocked.
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-10.0.2.2}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-exparter-dev}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro

volumes:
  garage-meta:
  garage-data:
  postgres-data:
