<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Parola sıfırlama — Exparter</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/auth.js" defer></script>
</head>
<body>
<main>
  <h1>Yeni parola belirleyin</h1>

  <form id="reset-form" class="form">
    <p>Exparter hesabınız için yeni bir parola seçin. Parola en az 8 karakter olmalı.</p>
    <label for="password">Yeni parola</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <label for="password-again">Yeni parola (tekrar)</label>
    <input id="password-again" name="password-again" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <button type="submit">Parolayı değiştir</button>
  </form>

  <p id="status" class="status" role="status" hidden></p>

  <footer><a href="/">Exparter</a> · <a href="/kullanim-kosullari.html">Kullanım koşulları</a> · <a href="/gizlilik.html">Gizlilik politikası</a></footer>
</main>
</body>
</html>
