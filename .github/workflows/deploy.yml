name: Deploy

# Publishes the API image and rolls it out to the server (docs/deployment.md). The
# rollout runs only once the server exists: the repository variable DEPLOY_HOST is set.
on:
  push:
    branches: [main]
    paths: ['backend/src/**', 'backend/Dockerfile', 'backend/Directory.Build.props', 'deploy/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One rollout at a time, and never cancelled halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish the API image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: name
        # Registry names must be lowercase; the owner's is not.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/exparter-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          # The server is an Oracle Cloud Ampere (ARM) machine.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rollout:
    name: Roll out to the server
    needs: image
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Trust the server and load the key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the compose file, the proxy configuration, the backup script and the public pages
        run: scp -r deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh deploy/site "$TARGET:exparter/"
      - name: Migrate the database, then start the new version
        run: |
          ssh "$TARGET" "cd exparter \
            && sed -i 's|^API_IMAGE=.*|API_IMAGE=$IMAGE|' .env \
            && docker compose pull api \
            && docker compose run --rm api --migrate \
            && docker compose up -d --remove-orphans \
            && docker image prune -f"
